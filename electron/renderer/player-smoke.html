<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Attune — IPC smoke</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --fg: #e8eaef;
        --muted: #9aa3b2;
        --accent: #7eb8ff;
        --warn: #f0c674;
        --ok: #8fdb8f;
        --bad: #f07178;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #1c2438, var(--bg));
        color: var(--fg);
        padding: 1.5rem 1.75rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        margin: 0 0 0.25rem;
      }
      .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
      button {
        appearance: none;
        border: 1px solid #2a3348;
        background: #1a2130;
        color: var(--fg);
        padding: 0.55rem 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: #243552; border-color: #3a5a8a; }
      .card {
        border: 1px solid #2a3348;
        border-radius: 12px;
        padding: 1rem 1.1rem;
        background: rgba(0,0,0,0.22);
        margin-bottom: 0.85rem;
      }
      .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
      #track { font-size: 1.15rem; margin-top: 0.2rem; }
      #meta { color: var(--muted); font-size: 0.9rem; margin-top: 0.15rem; }
      #banner {
        display: none;
        border: 1px solid #6a5420;
        background: #2a2310;
        color: var(--warn);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        margin-bottom: 0.85rem;
      }
      #banner.show { display: block; }
      #status { color: var(--muted); font-size: 0.85rem; }
      #log {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.75rem;
        color: var(--muted);
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Attune IPC</h1>
    <p class="sub">Player bridge smoke — now-playing + no-device prompt</p>

    <div class="row">
      <button class="primary" id="start">Start session</button>
      <button id="stop">Stop</button>
      <button id="nudge">Not vibing</button>
    </div>

    <div id="banner">Poke play in Spotify — no active device</div>

    <div class="card">
      <div class="label">Now playing</div>
      <div id="track">—</div>
      <div id="meta">Waiting for player:state…</div>
    </div>

    <p id="status">Idle</p>
    <div class="card">
      <div class="label">IPC log</div>
      <div id="log"></div>
    </div>

    <script src="./player-smoke.js"></script>
  </body>
</html>
